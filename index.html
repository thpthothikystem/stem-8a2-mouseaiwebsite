/* =========================================================
   MARKDOWN + MATH
========================================================= */

function renderMarkdown(text){

    let math=[];


    text=text.replace(
        /\\\[([\s\S]*?)\\\]/g,
        function(_,x){

            math.push("\\["+x+"\\]");

            return "MATHBLOCK"
                +(math.length-1)
                +"MATHBLOCK";

        }
    );


    text=text.replace(
        /\\\(([\s\S]*?)\\\)/g,
        function(_,x){

            math.push("\\("+x+"\\)");

            return "MATHINLINE"
                +(math.length-1)
                +"MATHINLINE";

        }
    );


    let html=
        marked.parse(text,{
            breaks:true,
            gfm:true
        });


    html=html.replace(
        /MATHBLOCK(\d+)MATHBLOCK/g,
        function(_,i){

            return math[i];

        }
    );


    html=html.replace(
        /MATHINLINE(\d+)MATHINLINE/g,
        function(_,i){

            return math[i];

        }
    );


    return html;

}

/* =========================================================
   IMAGE HANDLING
========================================================= */

function isImageFile(file){

    return file &&
           file.type &&
           file.type.startsWith("image/");

}


function readImage(file){

    return new Promise((resolve,reject)=>{

        const reader=
            new FileReader();

        reader.onload=()=>{
            resolve(reader.result);
        };

        reader.onerror=reject;

        reader.readAsDataURL(file);

    });

}


const input=
    document.getElementById("input");


input.addEventListener(
    "paste",
    async function(e){

        const items=
            e.clipboardData?.items;

        if(!items)return;


        for(const item of items){

            if(!item.type.startsWith("image/"))
                continue;


            const file=
                item.getAsFile();

            if(!file)
                continue;


            e.preventDefault();


            try{

                const image=
                    await readImage(file);

                pendingImage=image;


                const current=
                    this.value.trim();


                if(!current){

                    Math.min(
                        this.scrollHeight,
                        140
                    )+"px";


            }catch(error){

                console.error(error);

            }


            break;

        }

    }
);


/* =========================================================
   GROQ REQUEST
========================================================= */

async function askGroq(text,image){

    const recentMemory=
        memory.slice(-API_MEMORY_LIMIT);


    const messages=[

        {
            role:"system",
            content:SYSTEM_PROMPT
        },

        ...recentMemory

    ];


    if(image){

        const lastUserIndex=
            messages.length-1;


        messages[lastUserIndex]={

            role:"user",

            content:[

                {
                    type:"text",
                    text:text ||
                        "Hãy phân tích ảnh này theo phạm vi STEM của Mouse AI."
                },

                {
                    type:"image_url",

                    image_url:{
                        url:image
                    }

                }

            ]

        };

    }


    const response=
        await fetch(

            GROQ_API_URL,

            {

                method:"POST",

                headers:{

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer "+GROQ_API_KEY

                },

                body:JSON.stringify({

                    model:GROQ_MODEL,

                    messages:messages,

                    temperature:0.4,

                    max_tokens:3072

                })

            }

        );


    if(!response.ok){

        throw new Error(
            "Groq request failed"
        );

    }


    const data=
        await response.json();


    const answer=
        data.choices?.[0]?.message?.content;


    if(!answer){

        throw new Error(
            "Groq returned no answer"
        );

    }


    return answer;

}


/* =========================================================
   GEMINI REQUEST
========================================================= */

function memoryToGeminiContents(text,image){

    const contents=[];


    const recentMemory=
        memory.slice(-API_MEMORY_LIMIT);


    for(const m of recentMemory){

        if(!m.content)
            continue;


        contents.push({

            role:
                m.role==="assistant"
                    ? "model"
                    : "user",

            parts:[

                {
                    text:m.content
                }

            ]

        });

    }


    if(image){

        contents.push({

            role:"user",

            parts:[

                {
                    text:
                        text ||
                        "Hãy phân tích ảnh này theo phạm vi STEM của Mouse AI."
                },

                {
                    inline_data:{
                        mime_type:
                            image.split(";")[0]
                                .replace("data:",""),

                        data:
                            image.split(",")[1]
                    }

                }

            ]

        });

    }else{

        contents.push({

            role:"user",

            parts:[

                {
                    text:text
                }

            ]

        });

    }


    return contents;

}


async function askGemini(text,image){

    const key=GEMINI_API_KEY;


    if(
        !key ||
        key==="YOUR_GEMINI_API_KEY"
    ){

        throw new Error(
            "Gemini key unavailable"
        );

    }


    const body={

        system_instruction:{

            parts:[

                {
                    text:SYSTEM_PROMPT
                }

            ]

        },

        contents:
            memoryToGeminiContents(
                text,
                image
            ),

        generationConfig:{

            temperature:0.4,

            maxOutputTokens:3072

        }

    };


    const response=
        await fetch(

            GEMINI_API_URL
            +"?key="
            +encodeURIComponent(key),

            {

                method:"POST",

                headers:{

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify(body)

            }

        );


    if(!response.ok){

        throw new Error(
            "Gemini request failed"
        );

    }


    const data=
        await response.json();


    const answer=
        data.candidates?.[0]
        ?.content?.parts
        ?.map(part=>part.text || "")
        .join("")
        .trim();


    if(!answer){

        throw new Error(
            "Gemini returned no answer"
        );

    }


    return answer;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    const text=
        input.value.trim();


    if(!text && !pendingImage){

        return;

    }


    const imageToSend=
        pendingImage;


    const userText=
        text ||
        "Hãy phân tích ảnh này.";


    input.value="";

    input.style.height="auto";


    addUserMessage(
        userText,
        imageToSend
    );


    memory.push({

        role:"user",

        content:userText

    });


    saveMemory();


    showTyping();


    let answer=null;


    try{

        try{

            if(
                GROQ_API_KEY &&
                GROQ_API_KEY!=="YOUR_GROQ_API_KEY"
            ){

                answer=
                    await askGroq(
                        userText,
                        imageToSend
                    );

            }

        }catch(groqError){

            answer=null;

        }


        if(!answer){

            try{

                answer=
                    await askGemini(
                        userText,
                        imageToSend
                    );

            }catch(geminiError){

                answer=null;

            }

        }


        removeTyping();


        if(!answer){

            addAIMessage(
                "Mouse AI đang bị lỗi."
            );

            pendingImage=null;

            return;

        }


        addAIMessage(answer);


        memory.push({

            role:"assistant",

            content:answer

        });


        saveMemory();


        pendingImage=null;


    }catch(error){

        removeTyping();

        pendingImage=null;

        addAIMessage(
            "Mouse AI đang bị lỗi."
        );

    }

}
