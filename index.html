<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mouse AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>

    <div class="app">

        <header>
            <div class="logo">
                <div class="mouse-icon">●</div>

                <div>
                    <h1>Mouse AI</h1>
                    <p>Trợ lý Toán học của cậu</p>
                </div>
            </div>

            <div class="status">
                <span></span>
                ONLINE
            </div>
        </header>


        <main id="chat-box">

            <div class="message ai-msg welcome">
                <div class="ai-name">Mouse AI</div>

                <div class="bubble">
                    Chào cậu! Có bài Toán nào cần tớ giúp không?
                </div>
            </div>

        </main>


        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Nhập bài Toán của cậu..."
                autocomplete="off"
            >

            <button onclick="sendMessage()">
                Gửi
            </button>

        </div>

    </div>


    <script>

        // =========================
        // API KEY
        // =========================

        const API_KEY = "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";


        // =========================
        // MODEL
        // =========================

        const MODEL = "openai/gpt-oss-20b";


        // =========================
        // BIẾN
        // =========================

        const chatBox =
            document.getElementById("chat-box");

        const userInput =
            document.getElementById("user-input");

        let lastMessage = "";


        // =========================
        // ENTER ĐỂ GỬI
        // =========================

        userInput.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        });


        // =========================
        // GỬI TIN NHẮN
        // =========================

        async function sendMessage(isRetry = false) {

            const text = isRetry
                ? lastMessage
                : userInput.value.trim();


            if (!text) {
                return;
            }


            lastMessage = text;


            // =========================
            // TIN NHẮN USER
            // =========================

            if (!isRetry) {

                const userMessage =
                    document.createElement("div");

                userMessage.className =
                    "message user-msg";

                const name =
                    document.createElement("div");

                name.className =
                    "user-name";

                name.textContent =
                    "Cậu";


                const bubble =
                    document.createElement("div");

                bubble.className =
                    "bubble";

                bubble.textContent =
                    text;


                userMessage.appendChild(name);
                userMessage.appendChild(bubble);

                chatBox.appendChild(userMessage);

                userInput.value = "";

            }
            else {

                const oldError =
                    document.getElementById("error-msg");

                if (oldError) {
                    oldError.remove();
                }

            }


            chatBox.scrollTop =
                chatBox.scrollHeight;


            // =========================
            // ĐANG SUY NGHĨ
            // =========================

            const typingId =
                "typing-" + Date.now();


            const typing =
                document.createElement("div");

            typing.id =
                typingId;

            typing.className =
                "message ai-msg";


            const name =
                document.createElement("div");

            name.className =
                "ai-name";

            name.textContent =
                "Mouse AI";


            const bubble =
                document.createElement("div");

            bubble.className =
                "bubble typing";

            bubble.innerHTML =
                "<span></span><span></span><span></span>";


            typing.appendChild(name);
            typing.appendChild(bubble);

            chatBox.appendChild(typing);

            chatBox.scrollTop =
                chatBox.scrollHeight;


            try {

                // =========================
                // GỌI GROQ
                // =========================

                const response = await fetch(
                    "https://api.groq.com/openai/v1/chat/completions",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",

                            "Authorization":
                                "Bearer " + API_KEY
                        },

                        body: JSON.stringify({

                            model: MODEL,

                            messages: [

                                {
                                    role: "system",

                                    content: `
Bạn là Mouse AI, một trợ lý dạy Toán.

- Luôn xưng "tớ", gọi người dùng là "cậu".
- Thân thiện, tự nhiên, nói ngắn gọn.
- Giải thích Toán dễ hiểu, ưu tiên từng bước rõ ràng.
- Không dùng lời văn quá formal hoặc kiểu AI.
- Khi người dùng hỏi bài, tập trung giải đúng bài đó.
- Nếu có nhiều cách giải, ưu tiên cách đơn giản và phù hợp với học sinh.
- Không lan man sang những thứ không liên quan.
`
                                },

                                {
                                    role: "user",
                                    content: text
                                }

                            ]

                        })
                    }
                );


                const data =
                    await response.json();


                // =========================
                // XÓA LOADING
                // =========================

                const oldTyping =
                    document.getElementById(typingId);

                if (oldTyping) {
                    oldTyping.remove();
                }


                // =========================
                // LỖI
                // =========================

                if (!response.ok) {

                    console.log(
                        "Groq error:",
                        data
                    );

                    showError();

                    return;
                }


                // =========================
                // LẤY CÂU TRẢ LỜI
                // =========================

                const aiReply =
                    data.choices?.[0]?.message?.content
                    || "Tớ bị kẹt chữ mất rồi.";


                // =========================
                // HIỆN AI
                // =========================

                const aiMessage =
                    document.createElement("div");

                aiMessage.className =
                    "message ai-msg";


                const aiName =
                    document.createElement("div");

                aiName.className =
                    "ai-name";

                aiName.textContent =
                    "Mouse AI";


                const bubble =
                    document.createElement("div");

                bubble.className =
                    "bubble";


                bubble.innerHTML =
                    aiReply
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/\n/g, "<br>");


                aiMessage.appendChild(aiName);
                aiMessage.appendChild(bubble);

                chatBox.appendChild(aiMessage);


                chatBox.scrollTop =
                    chatBox.scrollHeight;

            }


            // =========================
            // LỖI KẾT NỐI
            // =========================

            catch (error) {

                console.log(
                    "Error:",
                    error
                );


                const oldTyping =
                    document.getElementById(typingId);

                if (oldTyping) {
                    oldTyping.remove();
                }


                showError();

            }

        }


        // =========================
        // HIỆN LỖI
        // =========================

        function showError() {

            const errorBox =
                document.createElement("div");

            errorBox.id =
                "error-msg";

            errorBox.className =
                "message ai-msg";


            const name =
                document.createElement("div");

            name.className =
                "ai-name";

            name.textContent =
                "Mouse AI";


            const bubble =
                document.createElement("div");

            bubble.className =
                "bubble error";


            const text =
                document.createElement("span");

            text.textContent =
                "Có lỗi kết nối.";


            const retry =
                document.createElement("button");

            retry.className =
                "retry-btn";

            retry.textContent =
                "Thử lại";


            retry.onclick =
                function() {
                    sendMessage(true);
                };


            bubble.appendChild(text);
            bubble.appendChild(retry);

            errorBox.appendChild(name);
            errorBox.appendChild(bubble);

            chatBox.appendChild(errorBox);


            chatBox.scrollTop =
                chatBox.scrollHeight;

        }

    </script>

</body>
</html>
