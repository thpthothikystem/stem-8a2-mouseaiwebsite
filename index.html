<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mouse AI</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
window.MathJax={
    tex:{
        inlineMath:[['\\(','\\)']],
        displayMath:[['\\[','\\]']]
    },
    svg:{
        fontCache:'global'
    }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>

<div class="bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="stars"></div>
</div>

<div id="welcome" class="welcome">
    <div class="welcome-logo">M</div>
    <h1>Mouse AI</h1>
    <p>Trợ lý Toán học cho học sinh</p>
    <span>Sản phẩm STEM của lớp 8A2</span>
    <button onclick="startChat()">BẮT ĐẦU</button>
</div>

<div id="app" class="app hidden">

    <header>
        <div class="brand">
            <div class="logo">M</div>
            <div>
                <h2>Mouse AI</h2>
                <div class="status">
                    <span></span>
                    ONLINE
                </div>
            </div>
        </div>

        <button class="clear-btn" onclick="clearMemory()">Xóa memory</button>
    </header>

    <main id="chatBox" class="chat-box"></main>

    <div class="input-area">
        <textarea id="input" placeholder="Hỏi Mouse AI một bài Toán..." rows="1"></textarea>
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

</div>

<script>
const API_KEY="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";
const API_URL="https://api.groq.com/openai/v1/chat/completions";
const MODEL="openai/gpt-oss-20b";

const SYSTEM_PROMPT=`
Bạn là Mouse AI, một trợ lý dạy Toán cho học sinh.

PHONG CÁCH:
- Luôn xưng "tớ", gọi người dùng là "cậu".
- Thân thiện và tự nhiên.
- Nói dễ hiểu.
- Không dùng văn phong quá formal.
- Không lan man.
- Câu trả lời vừa đủ, không dài không cần thiết.
- Khi bài Toán khó, giải từng bước rõ ràng.
- Ưu tiên cách giải đơn giản, phù hợp với học sinh.
- Không tự bịa dữ kiện.
- Nếu thiếu dữ kiện thì hỏi lại.
-Được tạo ra bởi KhangIuCauNhiuhjhj.

TRÌNH BÀY:
- Hãy sử dụng Markdown để trình bày câu trả lời.
- Dùng **chữ in đậm** khi cần nhấn mạnh.
- Dùng ### cho tiêu đề nhỏ.
- Dùng danh sách với "-".
- Khi cần đánh số bước, dùng:
  1. Bước đầu
  2. Bước tiếp theo
  3. Kết luận
- Luôn xuống dòng giữa các đoạn.
- Không viết toàn bộ câu trả lời thành một đoạn văn dài.
- Khi giải bài Toán, mỗi bước nên nằm ở một đoạn riêng.
- Có thể dùng bảng Markdown khi cần.

CÔNG THỨC TOÁN:
- Công thức trong câu dùng:
  \\( ... \\)
- Công thức quan trọng hoặc dài dùng:
  \\[
  ...
  \\]
- Phân số dùng:
  \\frac{a}{b}
- Số mũ dùng:
  x^2
  x^{n+1}
- Căn dùng:
  \\sqrt{x}
  \\sqrt{x+1}
- Chỉ số dùng:
  a_1
  a_n

VÍ DỤ:

### Giải

Ta có:

\\[
2x+3=7
\\]

Chuyển \(3\) sang vế phải:

\\[
2x=7-3
\\]

Suy ra:

\\[
2x=4
\\]

Chia hai vế cho \(2\):

\\[
x=2
\\]

**Vậy \(x=2\).**

Hãy trình bày câu trả lời sạch sẽ, có khoảng cách giữa các đoạn và dễ đọc.
`;

let memory=[];

function saveMemory(){
    localStorage.setItem(
        "mouse_ai_memory",
        JSON.stringify(memory.slice(-30))
    );
}

function loadMemory(){
    let data=localStorage.getItem("mouse_ai_memory");

    if(!data)return;

    try{
        memory=JSON.parse(data);

        for(let m of memory){
            if(m.role==="user"){
                addUserMessage(m.content);
            }

            if(m.role==="assistant"){
                addAIMessage(m.content);
            }
        }
    }catch(e){
        memory=[];
    }
}

function scrollChat(){
    const chatBox=document.getElementById("chatBox");
    chatBox.scrollTop=chatBox.scrollHeight;
}

function addUserMessage(text){
    const message=document.createElement("div");
    message.className="message user-message";

    const bubble=document.createElement("div");
    bubble.className="chat-bubble user-bubble";
    bubble.textContent=text;

    message.appendChild(bubble);
    chatBox.appendChild(message);

    scrollChat();
}

function renderMarkdown(text){
    let math=[];

    text=text.replace(/\\\[([\s\S]*?)\\\]/g,function(_,x){
        math.push("\\["+x+"\\]");
        return "MATHBLOCK"+(math.length-1)+"MATHBLOCK";
    });

    text=text.replace(/\\\(([\s\S]*?)\\\)/g,function(_,x){
        math.push("\\("+x+"\\)");
        return "MATHINLINE"+(math.length-1)+"MATHINLINE";
    });

    let html=marked.parse(text,{
        breaks:true,
        gfm:true
    });

    html=html.replace(
        /MATHBLOCK(\d+)MATHBLOCK/g,
        function(_,i){
            return math[i];
        }
    );

    html=html.replace(
        /MATHINLINE(\d+)MATHINLINE/g,
        function(_,i){
            return math[i];
        }
    );

    return html;
}

function addAIMessage(text){
    const message=document.createElement("div");
    message.className="message ai-message";

    const avatar=document.createElement("div");
    avatar.className="ai-avatar";
    avatar.textContent="M";

    const bubble=document.createElement("div");
    bubble.className="chat-bubble ai-bubble";
    bubble.innerHTML=renderMarkdown(text);

    message.appendChild(avatar);
    message.appendChild(bubble);
    chatBox.appendChild(message);

    if(window.MathJax){
        MathJax.typesetPromise([bubble]).catch(()=>{});
    }

    scrollChat();
}

function showTyping(){
    const message=document.createElement("div");
    message.className="message ai-message";
    message.id="typing";

    const avatar=document.createElement("div");
    avatar.className="ai-avatar";
    avatar.textContent="M";

    const bubble=document.createElement("div");
    bubble.className="chat-bubble ai-bubble typing";

    bubble.innerHTML="<span></span><span></span><span></span>";

    message.appendChild(avatar);
    message.appendChild(bubble);
    chatBox.appendChild(message);

    scrollChat();
}

function removeTyping(){
    const typing=document.getElementById("typing");

    if(typing){
        typing.remove();
    }
}

async function sendMessage(){
    const input=document.getElementById("input");
    const text=input.value.trim();

    if(!text)return;

    input.value="";
    input.style.height="auto";

    addUserMessage(text);

    memory.push({
        role:"user",
        content:text
    });

    saveMemory();

    showTyping();

    try{
        const messages=[
            {
                role:"system",
                content:SYSTEM_PROMPT
            },
            ...memory
        ];

        const response=await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer "+API_KEY
            },
            body:JSON.stringify({
                model:MODEL,
                messages:messages,
                temperature:0.5
            })
        });

        const data=await response.json();

        removeTyping();

        if(!response.ok){
            throw new Error(
                data.error?.message||"Có lỗi xảy ra."
            );
        }

        const answer=data.choices?.[0]?.message?.content;

        if(!answer){
            throw new Error("AI không trả về câu trả lời.");
        }

        addAIMessage(answer);

        memory.push({
            role:"assistant",
            content:answer
        });

        saveMemory();

    }catch(error){
        removeTyping();

        const errorText=
            "Tớ gặp lỗi khi kết nối với AI.\n\n"+
            "`"+error.message+"`";

        addAIMessage(errorText);
    }
}

function clearMemory(){
    if(!confirm("Xóa toàn bộ memory của Mouse AI?"))return;

    memory=[];
    localStorage.removeItem("mouse_ai_memory");

    document.getElementById("chatBox").innerHTML="";
}

function startChat(){
    document.getElementById("welcome").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    if(memory.length===0){
        addAIMessage(
            "### Chào cậu\n\n"+
            "Tớ là **Mouse AI**. Cậu cứ gửi bài Toán cho tớ, tớ sẽ cùng cậu giải từng bước."
        );
    }

    document.getElementById("input").focus();
}

const input=document.getElementById("input");

input.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){
        e.preventDefault();
        sendMessage();
    }
});

input.addEventListener("input",function(){
    this.style.height="auto";
    this.style.height=Math.min(this.scrollHeight,140)+"px";
});

loadMemory();

if(memory.length>0){
    document.getElementById("welcome").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
}
</script>

</body>
</html>
