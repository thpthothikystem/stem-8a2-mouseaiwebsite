<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Web AI Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding-top: 50px; }
        #chat-container { width: 450px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 20px; }
        #chat-box { height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #fafafa; }
        .message { margin-bottom: 10px; padding: 10px 15px; border-radius: 15px; max-width: 75%; line-height: 1.4; word-wrap: break-word; }
        .user-msg { background-color: #007bff; color: white; margin-left: auto; border-bottom-right-radius: 2px; }
        .ai-msg { background-color: #e9ecef; color: black; margin-right: auto; border-bottom-left-radius: 2px; }
        #input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        button { padding: 10px 20px; border: none; background-color: #28a745; color: white; border-radius: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .retry-btn { padding: 5px 12px; border: none; background-color: #ffc107; color: black; border-radius: 15px; cursor: pointer; font-size: 13px; margin-left: 10px; font-weight: bold; }
        .retry-btn:hover { background-color: #e0a800; }
    </style>
</head>
<body>
    <div id="chat-container">
        <h2 style="text-align: center; color: #333; margin-top: 0;">Trợ lý AI Gemini 3.6 🤖</h2>
        <div id="chat-box"></div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Hỏi tôi bất cứ điều gì..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>
    <script>
        const URL = 'https://small-sound-702a.tranthanhliem-cmpp.workers.dev/';
        let lastMessage = ""; 
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        async function sendMessage(isRetry = false) {
            const text = isRetry ? lastMessage : userInput.value.trim();
            if (!text) return;
            lastMessage = text;

            if (!isRetry) {
                chatBox.innerHTML += `<div class="message user-msg"><b>Bạn:</b> ${text}</div>`;
                userInput.value = '';
            } else {
                const oldError = document.getElementById('error-msg');
                if (oldError) oldError.remove();
            }

            chatBox.scrollTop = chatBox.scrollHeight;
            const typingId = "typing-" + Date.now();
            chatBox.innerHTML += `<div id="${typingId}" class="message ai-msg"><i>AI đang suy nghĩ...</i></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                });
                
                const data = await response.json();
                document.getElementById(typingId).remove();

                if (data.error || !response.ok) {
                    const errorDetail = data.error ? data.error.message : response.statusText;
                    showError(errorDetail);
                } else {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    const formattedReply = aiReply.replace(/\n/g, '<br>');
                    chatBox.innerHTML += `<div class="message ai-msg"><b>AI:</b> ${formattedReply}</div>`;
                }
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                document.getElementById(typingId).remove();
                showError(error.message);
            }
        }

        function showError(detail) {
            chatBox.innerHTML += `
            <div id="error-msg" class="message ai-msg" style="color: red;">
                <b>Lỗi hệ thống:</b> ${detail} <br>
                <button class="retry-btn" onclick="sendMessage(true)">Thử lại</button>
            </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
