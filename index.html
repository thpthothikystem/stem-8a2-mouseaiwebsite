<script>
    const URL = 'https://small-sound-702a.tranthanhliem-cmpp.workers.dev/';
    let lastMessage = ""; 
    
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');

    async function sendMessage(isRetry = false) {
        const text = isRetry ? lastMessage : userInput.value.trim();
        if (!text) return;

        lastMessage = text;

        if (!isRetry) {
            chatBox.innerHTML += `<div class="message user-msg"><b>Bạn:</b> ${text}</div>`;
            userInput.value = '';
        } else {
            const oldError = document.getElementById('error-msg');
            if (oldError) oldError.remove();
        }

        chatBox.scrollTop = chatBox.scrollHeight;

        const typingId = "typing-" + Date.now();
        chatBox.innerHTML += `<div id="${typingId}" class="message ai-msg"><i>AI đang suy nghĩ...</i></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch(URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });
            
            const data = await response.json();
            document.getElementById(typingId).remove();

            if (data.error || !response.ok) {
                const errorDetail = data.error ? data.error.message : response.statusText;
                showError(errorDetail);
            } else {
                const aiReply = data.candidates[0].content.parts[0].text;
                const formattedReply = aiReply.replace(/\n/g, '<br>');
                chatBox.innerHTML += `<div class="message ai-msg"><b>AI:</b> ${formattedReply}</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;

        } catch (error) {
            document.getElementById(typingId).remove();
            showError(error.message);
        }
    }

    function showError(detail) {
        chatBox.innerHTML += `
        <div id="error-msg" class="message ai-msg" style="color: red;">
            <b>Lỗi hệ thống:</b> ${detail} <br>
            <button class="retry-btn" onclick="sendMessage(true)">Thử lại</button>
        </div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
